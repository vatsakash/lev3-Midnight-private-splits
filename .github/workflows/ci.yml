name: CI/CD Pipeline - Private Payroll Splits

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck & Lint
        run: npm run lint

      - name: Run Vitest Unit & ZK Privacy Test Suite
        run: npm test

      - name: Build Web Application Bundle
        run: npm run build
